name: pytest-cpu
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest          # minimal deps — the CPU-safe modules import nothing else
      # CPU-import-safe modules only (AST-verified, no top-level torch).
      # conftest.py returns early without torch; CUDA tests skipif-skip.
      # The repo's REAL gate is Colab T4 (colab_pytest.py) — this is a PR smoke net.
      - run: python -m pytest tests/test_artefact_provenance.py tests/test_counter_clamp.py tests/test_decl_arity.py tests/test_dispatch_order.py tests/test_flip_budget_guards.py tests/test_flip_rate_verdict.py tests/test_graph_replay_parity.py tests/test_perfgate_logic.py tests/test_update_dimensional_bug.py -q
