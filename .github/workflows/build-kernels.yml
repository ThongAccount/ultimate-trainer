name: build-kernels

# Builds every load_inline CUDA extension on CI and publishes the torch
# extension cache as a release asset (tag `kernels-latest`) so Colab T4 VMs
# download prebuilt .so files instead of paying nvcc JIT time out of free GPU
# session minutes. See docs/speedpass/2026-10-31-prebuilt-kernels.md.
#
# MIGRATION (2026-11-21): master now uses the shipped cuBLAS arm (no custom
# kernels). This workflow runs ONLY on reference/custom-arm (the bit-exact
# test oracle). Master does NOT publish kernels-latest bundles — the shipped
# arm uses cuBLAS, not custom kernels.
#
# ABI contract: the container's toolchain must match the Colab VM exactly —
# python 3.13, torch==2.11.0+cu130, CUDA 13.0 nvcc, TORCH_CUDA_ARCH_LIST=7.5
# (set by kernels/common.py). The extension tag py313_cu130 must equal the
# VM's; tools/fetch_prebuilt.py hard-fails the download on mismatch.

on:
  push:
    branches: [reference/custom-arm]
    paths:
      - "kernels/**"
      - "build_kernels.py"
      - "tools/build_kernel_bundle.py"
      - "tools/fetch_prebuilt.py"
      - "tools/publish_bundle.py"
      - "requirements.txt"
      - ".github/workflows/build-kernels.yml"
  workflow_dispatch:
    inputs:
      bundle_tag:
        description: "Release tag to publish the kernel bundle to (default kernels-latest; use a per-branch tag like kernels-fwd-xpose when dispatching from a kernel-changing feature branch)"
        required: false
        default: "kernels-latest"

permissions:
  contents: write  # release asset upload

jobs:
  bundle:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.0.1-devel-ubuntu24.04  # nvcc 13.0, gcc, glibc for py3.13 wheels
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # must equal the Colab VM python (3.13.16)

      - name: deps (torch cu130 + build tools + ccache)
        run: |
          df -h /
          apt-get update && apt-get install -y --no-install-recommends ccache
          # bare `pip` is NOT on PATH in container jobs — always `python -m pip`
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir torch==2.11.0+cu130 \
            --index-url https://download.pytorch.org/whl/cu130 \
            --extra-index-url https://pypi.org/simple
          python -m pip install --no-cache-dir ninja numpy setuptools "triton>=3.0.0"
          nvcc --version | tail -1
          ccache --version | head -1
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.version.cuda)"

      - name: torch extensions cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ext_cache/torch_extensions
          key: torch-ext-${{ hashFiles('kernels/**', 'build_kernels.py', 'tools/build_kernel_bundle.py') }}
          restore-keys: |
            torch-ext-

      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: ccache-kernels-${{ hashFiles('kernels/**', 'build_kernels.py', 'tools/build_kernel_bundle.py') }}
          restore-keys: |
            ccache-kernels-

      - name: ccache env (host-side C++ only)
        run: |
          echo "CCACHE_DIR=/root/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=true" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESSLEVEL=6" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          # load_inline generates a random temp dir per run; ignore the
          # directory in the ccache hash so restored caches actually hit.
          echo "CCACHE_NOHASHDIR=true" >> "$GITHUB_ENV"
          # Fixed workdir for load_inline so ccache source paths are stable
          # across runs (random temp dirs defeat the cache).
          # Use $GITHUB_WORKSPACE so the path is mounted from the host and
          # actions/cache can access it for save/restore.
          echo "UT_EXT_WORKDIR=$GITHUB_WORKSPACE/.ext_cache" >> "$GITHUB_ENV"
          # CC=gcc (NOT "ccache gcc") so nvcc's -ccbin gets a single-word path.
          # CXX=ccache g++ for the C++ wrapper files — these ARE cached.
          # The main build-time win is the torch_extensions cache above:
          # load_inline skips nvcc entirely when the version hash matches.
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "CXX=ccache g++" >> "$GITHUB_ENV"
          ccache -s

      - name: expose CUDA headers to host c++ compiles (CPATH self-heal)
        run: |
          ls -l /usr/local/cuda/include/cuda_runtime.h 2>/dev/null \
            || echo "note: cuda_runtime.h not at /usr/local/cuda/include"
          HDR=$(dirname "$(find /usr/local/cuda* -name cuda_runtime.h 2>/dev/null | head -1)")
          echo "cuda header dir: ${HDR:-NONE}"
          if [ -n "$HDR" ]; then
            echo "CPATH=$HDR${CPATH:+:$CPATH}" >> "$GITHUB_ENV"
          fi

      - name: fetch previous bundle (skip nvcc on cache hit)
        run: |
          # Download the previous release bundle into TORCH_EXTENSIONS_DIR.
          # load_inline skips nvcc when the version hash matches, so a
          # successful fetch turns the build into a plain dlopen.
          export TORCH_EXTENSIONS_DIR="$UT_EXT_WORKDIR/torch_extensions"
          python tools/fetch_prebuilt.py --repo-dir . --tag kernels-latest \
            || echo "PREBUILT: no previous bundle — full nvcc build"

      - name: build kernel bundle
        run: python tools/build_kernel_bundle.py --out dist

      - name: ccache stats (post-build)
        run: ccache -s

      - name: publish release assets (tag from UT_KERNELS_TAG, stdlib python — no curl/gh in container)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UT_KERNELS_TAG: ${{ inputs.bundle_tag || 'kernels-latest' }}
        run: python tools/publish_bundle.py dist
